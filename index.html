<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кабинеты учеников</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #fbf1ec;
      --bg-soft: #f7e8e1;
      --card: #fffdfc;
      --card-alt: #fff9f6;
      --border: #f0dcd4;
      --border-soft: #f4e5df;
      --text: #3b2b2c;
      --text-muted: #9a8386;
      --accent: #a34b52;
      --accent-dark: #7d363d;
      --accent-soft: #f5e2df;
      --accent-soft2: #fbeeea;
      --shadow: 0 14px 34px rgba(122, 60, 60, 0.09);
      --shadow-sm: 0 4px 14px rgba(122, 60, 60, 0.06);
      --radius: 20px;
      --radius-sm: 13px;
      --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 8% 0%, rgba(163,75,82,0.06), transparent 40%),
        radial-gradient(circle at 100% 20%, rgba(163,75,82,0.05), transparent 45%);
      color: var(--text);
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .heading {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent-soft), var(--accent-soft2));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 600;
      font-size: 18px;
      color: var(--accent-dark);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 32px;
      line-height: 1.1;
      font-weight: 500;
    }

    h1 .accent {
      font-style: italic;
      color: var(--accent-dark);
      font-weight: 600;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .teacher {
      padding: 9px 14px;
      border: 1px solid var(--border);
      background: rgba(255,253,252,.7);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 12px;
      box-shadow: var(--shadow-sm);
    }

    .teacher strong {
      color: var(--text);
      font-weight: 600;
    }

    .student-list {
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      transition: .15s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 36px rgba(122, 60, 60, 0.11);
    }

    .student {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .student-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex: 0 0 44px;
      background: linear-gradient(145deg, var(--accent-soft), var(--accent-soft2));
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 16px;
      font-style: italic;
      color: var(--accent-dark);
    }

    .name {
      font-family: var(--serif);
      font-size: 21px;
      margin-bottom: 4px;
    }

    .meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: .15s ease;
      box-shadow: 0 5px 14px rgba(163,75,82,.14);
    }

    .btn:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 28px;
      color: var(--text-muted);
      font-size: 11px;
      padding-left: 3px;
    }

    @media (max-width: 600px) {
      .page { padding: 22px 14px 36px; }
      header { align-items: flex-start; }
      h1 { font-size: 28px; }
      .card { padding: 15px; }
      .btn { padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="heading">
        <div class="avatar">А</div>
        <div>
          <div class="eyebrow">Личный кабинет</div>
          <h1>Кабинеты <span class="accent">учеников</span></h1>
          <p class="subtitle">Выберите ученика, чтобы открыть его личный кабинет.</p>
        </div>
      </div>
      <div class="teacher">Учитель: <strong>Александр</strong></div>
    </header>

    <main class="student-list">
      <div class="card">
        <div class="student">
          <div class="student-avatar">Д</div>
          <div>
            <div class="name">Дарья</div>
            <div class="meta">ЕГЭ</div>
          </div>
        </div>
        <a class="btn" href="Evg/index1.html">Открыть кабинет</a>
      </div>
    </main>

    <footer>Кабинеты учеников</footer>
  </div>
</body>
</html>
